name: Build Signed Android AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Keystore in Cloud
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Developer, OU=App, O=Company, L=City, S=State, C=US"

      - name: Build and Sign AAB via Cordova
        run: |
          npm install -g cordova
          cordova create build_app com.example.myapp "My App"
          
          # Copy web files into Cordova build folder
          rm -rf build_app/www/*
          cp -r $(ls -A | grep -v '^build_app$' | grep -v '^\.git$' | grep -v '^release\.keystore$') build_app/www/
          
          cd build_app
          cordova platform add android
          
          # Build signed release AAB
          cordova build android --release -- --appx \
            --keystore="../release.keystore" \
            --storePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            --alias="${{ secrets.KEY_ALIAS }}" \
            --password="${{ secrets.KEY_PASSWORD }}" \
            --packageType=bundle

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: build_app/platforms/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Keystore Backup (Important!)
        uses: actions/upload-artifact@v4
        with:
          name: my-release-keystore-backup
          path: release.keystore
